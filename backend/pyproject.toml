[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
seed = "app.db.seed:run_seed"

[dependency-groups]
dev = [
    "faker>=40.37.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/"]
